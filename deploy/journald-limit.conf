[Journal]
# 本文件是「WiFi Manager 全新安装」的配置模板，位于 deploy/journald-limit.conf
#
# 为什么需要它：这台 NAS 的根文件系统在 eMMC 上（/dev/mmcblk0p9 -> /），
# 而 journald 默认把日志持久化到 /var/log/journal。实测该目录已占用
# 673 MB，且 journald.conf 里**没有** SystemMaxUse —— 日志可以无限增长。
# 这是闪存磨损的主要来源之一（远大于本软件自身）。
#
# 建议值：
#   SystemMaxUse=200M   总上限，超过后自动轮转删除最旧日志
#   SystemKeepFree=500M 磁盘剩余低于此值时更激进地清理
#
# eMMC 容量仅 7.3G（已用 69%），留足余量很重要。
# 生效：systemctl restart systemd-journald

SystemMaxUse=200M
SystemKeepFree=500M

# 不转发到远端（本机不通外网），避免无谓网络请求
ForwardToSyslog=no
ForwardToWall=no

# 存储策略：persistent 才会落盘；如果想省闪存可改用 none（但会失去日志）
# Storage=persistent
