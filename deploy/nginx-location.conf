# WiFi Manager —— nginx 反代片段
# 目标：/etc/nginx/locations.d/wifimgr.conf
#
# 为什么不改 sites-enabled/default：
#   那个块末尾已有 `include /etc/nginx/locations.d/*;`，而该目录已存在
#   （里面有 alist / filebrowser / h5ai）。新增一个文件即可，厂商 WebUI 完全不受影响。

location = /wifi {
    return 301 /wifi/;
}

location /wifi/ {
    # 尾部斜杠 = nginx 会剥掉 /wifi/ 前缀，后端路由不带前缀
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WiFi 扫描/连接是慢操作（rescan 2-5s，con up 可达 45s）。
    # 应用内部已把慢操作改为 202 + job 轮询，正常响应很快；
    # 这里仍留足超时以防首次连接。
    proxy_connect_timeout 10s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;
    proxy_next_upstream   off;

    proxy_buffering     on;
    proxy_buffer_size   8k;
    proxy_buffers       8 8k;

    client_max_body_size 16k;
    client_body_timeout  20s;

    # 安全头。注意：location 内的 add_header 会覆盖父块所有 add_header，
    # 所以这里必须自己补齐，不能指望继承。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY    always;
    add_header Referrer-Policy        no-referrer always;
    add_header Cache-Control          "no-store" always;

    access_log /var/log/nginx/wifimgr.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/wifimgr.error.log warn;
}
